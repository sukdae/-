<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사마</title>
<meta name="description" content="사마(斯麻) — 무령왕과 무령왕릉을 소재로 한 미연시 선택지 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gowun+Batang:wght@400;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 레이아웃: 전체 화면 미연시. 색은 백제 금동대향로의 금동과 청동녹, 옻칠의 먹색과 주칠 */
:root {
  --bg: #121417;        /* 옻칠 먹색 */
  --panel: #1c2024;
  --line: #3a3f45;
  --paper: #ece2cb;     /* 마지(麻紙) 글자색 */
  --dim: #a9b5a6;
  --amber: #c9a35a;     /* 금동 */
  --green: #7fa792;     /* 청동녹 */
  --cinnabar: #c4553c;  /* 주칠 */
  --f-display: "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "Gowun Batang", "AppleMyungjo", serif;
  --f-han: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--paper); font-family: var(--f-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background-image: radial-gradient(ellipse at 50% -10%, #2a2a2e 0%, transparent 60%);
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: .02em; margin: 0; }
.logo span { font-family: var(--f-han); color: var(--amber); font-weight: 700; margin-right: .3em; }
.tools { display: flex; gap: 8px; }
button { font: inherit; cursor: pointer; }
.ghost { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 3px 10px; font-size: .82rem; }
.ghost:hover { color: var(--paper); border-color: var(--dim); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { display: grid; gap: 4px; }
.stat .lab { display: flex; justify-content: space-between; font-size: .78rem; color: var(--dim); letter-spacing: .04em; }
.stat .lab b { color: var(--paper); font-variant-numeric: tabular-nums; font-weight: 700; }
.bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 50%; transition: width .5s ease; }
.s-power i { background: var(--amber); } .s-nobles i { background: var(--green); } .s-people i { background: var(--cinnabar); } .s-diplo i { background: #8fb0d6; }
.eyebrow.ev { color: var(--cinnabar); }
.choice:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); background: transparent; }
.delta { font-size: .72rem; margin-left: 4px; }
.changes { display: flex; flex-wrap: wrap; gap: 6px 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
.changes .delta { margin: 0; font-size: .85rem; }
.text.mono p { font-size: 1.04rem; line-height: 1.95; color: #f3ead6; }
.text.mono p:last-child { color: var(--amber); font-family: var(--f-display); font-weight: 700; }
.choice .cost { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; }
.choice .cost .delta { margin: 0; font-size: .76rem; }
.choice.next .cost { justify-content: center; }
.delta.fate { color: var(--amber); }
.delta.up { color: var(--green); } .delta.down { color: var(--cinnabar); }

.scene { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.scene .inner { padding: 22px 22px 18px; display: grid; gap: 12px; }
.art { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--bg); }
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, var(--panel) 100%); }
.eyebrow { display: flex; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--amber); letter-spacing: .08em; }
.eyebrow .ref { color: var(--dim); letter-spacing: 0; }
.scene h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.text p { margin: 0 0 .7em; }
.text p:last-child { margin-bottom: 0; }
.say { border-left: 2px solid var(--amber); padding-left: 12px; }
.say .who { display: block; font-size: .8rem; color: var(--amber); font-weight: 700; }
.note { font-size: .86rem; color: var(--dim); }
details.src { border-top: 1px dashed var(--line); padding-top: 8px; }
details.src summary { cursor: pointer; font-size: .82rem; color: var(--dim); }
details.src .han { font-family: var(--f-han); font-size: 1.05rem; line-height: 1.9; margin: 6px 0 2px; color: var(--paper); }
details.src .pg { font-size: .76rem; color: var(--dim); }

.choices { display: grid; gap: 10px; }
.choice { text-align: left; background: transparent; color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; line-height: 1.55; transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--amber); background: rgba(212,155,60,.06); }
.choice small { display: block; color: var(--dim); font-size: .78rem; margin-top: 2px; }
.choice.next { text-align: center; color: var(--amber); }

.ending { border-color: var(--amber); }
.ending .kind { font-size: .78rem; padding: 1px 8px; border-radius: 3px; border: 1px solid currentColor; width: fit-content; }
.kind.hist { color: var(--amber); } .kind.if { color: var(--green); } .kind.dead { color: var(--cinnabar); }
.fact { background: rgba(0,0,0,.18); border-radius: 4px; padding: 10px 12px; font-size: .9rem; }
.fact b { color: var(--amber); }

.book { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.book div { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: .85rem; }
.book .got { border-color: var(--amber); }
.book .no { color: var(--dim); }
footer { font-size: .76rem; color: var(--dim); text-align: center; }
@media (max-width: 480px) {
  .scene .inner { padding: 16px 16px 16px; }
  .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
  .stat .lab { font-size: .72rem; }
  .book { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .scene { animation: none !important; } }
.scene { animation: rise .35s ease both; }
/* 인트로 화면 */
.cover .art { aspect-ratio: 4 / 3; }
.cover .art::after { background: linear-gradient(to bottom, rgba(15,32,29,.15) 30%, var(--panel) 100%); }
.cover .mast { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 1; text-align: center; padding: 0 16px; }
.cover .mast .han { font-family: var(--f-han); font-weight: 700; color: var(--amber); font-size: clamp(2.6rem, 11vw, 4.2rem); letter-spacing: .18em; line-height: 1.1; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
.cover .mast .ko { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .3em; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.cover .lede { font-size: 1.02rem; }
.cast { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cast div { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: .86rem; line-height: 1.5; }
.cast b { display: block; font-family: var(--f-display); color: var(--amber); }
.how { margin: 0; padding-left: 1.1em; font-size: .9rem; color: var(--dim); }
.how li { margin-bottom: .3em; } .how b { color: var(--paper); }
.cover h3 { font-family: var(--f-display); font-size: .95rem; margin: 4px 0 0; color: var(--amber); letter-spacing: .1em; }
.choice.start { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; color: var(--bg); background: var(--amber); border-color: var(--amber); }
.choice.start:hover { background: #e2ad52; }
@media (max-width: 480px) { .cast { grid-template-columns: 1fr; } }
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }

/* ---------- 미연시 화면 ---------- */
.vn { position: relative; height: clamp(520px, 76vh, 660px); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #07080a; cursor: pointer; user-select: none; -webkit-user-select: none; animation: rise .35s ease both; }
.vn .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.72) saturate(.9); }
.vn::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 18%, transparent 55%, rgba(0,0,0,.55) 100%); }
.sprites { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.sprite { position: absolute; bottom: 0; left: 50%; height: 90%; aspect-ratio: 1 / 1; transform: translateX(-50%); filter: drop-shadow(0 6px 22px rgba(0,0,0,.65)); animation: appear .45s ease both; }
.sprite.l { left: 30%; } .sprite.r { left: 70%; }
@keyframes appear { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
.place { position: absolute; z-index: 3; top: 10px; left: 12px; right: 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: var(--amber); letter-spacing: .06em; text-shadow: 0 1px 6px #000; }
.place b { font-family: var(--f-display); font-size: .95rem; color: var(--paper); letter-spacing: .02em; }
.vn.ev .place span { color: var(--cinnabar); }
.srcbtn { margin-left: auto; background: rgba(14,16,19,.7); color: var(--paper); cursor: pointer; }
.srcpop { position: absolute; z-index: 4; top: 40px; left: 12px; right: 12px; background: rgba(14,16,19,.94); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: default; }
.srcpop .han { font-family: var(--f-han); font-size: 1.05rem; line-height: 1.9; }
.srcpop .pg { font-size: .76rem; color: var(--dim); }
.box { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: 12px; min-height: 22%; max-height: 62%; overflow-y: auto; background: rgba(14,16,19,.88); border: 1px solid rgba(212,155,60,.45); border-radius: 6px; padding: 16px 18px 26px; box-shadow: 0 -6px 30px rgba(0,0,0,.4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.name { display: inline-block; margin: -8px 0 8px; background: var(--amber); color: #1a1206; font-family: var(--f-display); font-weight: 800; font-size: .88rem; padding: 1px 12px; border-radius: 3px; }
.name[hidden] { display: none; }
.line { font-size: 1.02rem; line-height: 1.85; white-space: pre-wrap; }
.line.note { color: var(--dim); font-size: .9rem; }
.line.mono { font-style: normal; color: #f3ead6; }
.line .changes { margin-top: 10px; white-space: normal; }
.more { position: absolute; right: 14px; bottom: 6px; color: var(--amber); font-size: .7rem; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.menu { position: absolute; z-index: 5; inset: 0; background: linear-gradient(to bottom, rgba(8,9,11,.25), rgba(8,9,11,.78) 45%); display: flex; overflow-y: auto; padding: 44px 16px 16px; cursor: default; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.menu[hidden], .srcpop[hidden], .more[hidden] { display: none; }
.menu-in { margin: auto 0; width: 100%; display: grid; gap: 10px; }
.menu .choice { background: rgba(28,32,36,.94); }
.menu .choice:hover { background: rgba(48,52,58,.96); }
.menu .choice:disabled { background: rgba(28,32,36,.6); }
.endcard { background: rgba(28,32,36,.95); border: 1px solid var(--amber); border-radius: 6px; padding: 18px; display: grid; gap: 10px; }
.endcard h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; margin: 0; }
@media (max-width: 480px) {
  .vn { height: clamp(520px, 78vh, 640px); }
  .sprite { height: 78%; } .sprite.l { left: 26%; } .sprite.r { left: 74%; }
  .box { left: 8px; right: 8px; bottom: 8px; padding: 14px 14px 24px; }
  .line { font-size: .96rem; }
}
@media (prefers-reduced-motion: reduce) { .sprite, .vn { animation: none; } .more { animation: none; } }

/* ---------- 전체 화면 (게임 진행 중) ---------- */
body.playing { padding: 0; overflow: hidden; background: #07080a; }
body.playing .wrap { max-width: none; display: block; }
body.playing footer, body.playing .logo { display: none; }
body.playing .vn { position: fixed; inset: 0; height: 100vh; height: 100dvh; border: 0; border-radius: 0; animation: none; }
body.playing header { position: fixed; z-index: 10; top: 12px; right: 14px; }
body.playing .hud { position: fixed; z-index: 10; top: 12px; left: 14px; width: min(560px, 58vw); padding: 8px 14px; background: rgba(14,16,19,.72); border: 1px solid rgba(212,155,60,.25); border-radius: 6px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
body.playing .ghost { background: rgba(14,16,19,.72); }
body.playing .place { top: 74px; left: 18px; right: 18px; font-size: .85rem; }
body.playing .place b { font-size: 1.1rem; }
body.playing .srcpop { top: 104px; max-width: 760px; }
body.playing .sprite { height: 86%; }
body.playing .box { left: 50%; right: auto; width: min(1080px, calc(100% - 32px)); transform: translateX(-50%); bottom: 20px; min-height: 0; height: 26%; max-height: none; padding: 18px 26px 28px; }
body.playing .line { font-size: 1.12rem; }
body.playing .menu { padding-top: 96px; }
body.playing .menu-in { max-width: 760px; margin: auto; }
@media (max-width: 640px) {
  body.playing header { top: 8px; right: 8px; }
  body.playing .hud { top: 46px; left: 8px; right: 8px; width: auto; padding: 6px 10px; }
  body.playing .place { top: 132px; left: 12px; right: 12px; }
  body.playing .srcpop { top: 160px; }
  body.playing .sprite { height: 70%; bottom: 16%; }
  body.playing .box { width: calc(100% - 16px); bottom: 8px; height: 34%; padding: 14px 16px 24px; }
  body.playing .line { font-size: 1rem; }
  body.playing .menu { padding-top: 168px; }
}

/* ---------- 사마 전용 ---------- */
.vn .bg { position: absolute; inset: 0; }
.vn .bg svg, .vn .bg img, .art svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.vn .bg { filter: brightness(.9); }
.relics { display: flex; flex-wrap: wrap; gap: 6px; }
.relics span { font-size: .78rem; padding: 2px 8px; border-radius: 3px; border: 1px dashed var(--line); color: var(--dim); }
.relics span.on { border-style: solid; border-color: var(--amber); color: var(--amber); }
.scene h3 { font-family: var(--f-display); font-size: .95rem; margin: 6px 0 0; color: var(--amber); letter-spacing: .1em; }
.book .no .note, .book .got .note { font-size: .78rem; }

/* 우호도: 오른쪽 패널 */
.hud { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.s-yang i { background: #d98a5b; } .s-wa i { background: #8fb0d6; }
body.playing .hud { width: min(460px, 52vw); }
body.playing .rel { position: fixed; z-index: 10; top: 58px; right: 14px; width: 190px; grid-template-columns: 1fr; gap: 8px; padding: 10px 14px; background: rgba(14,16,19,.72); border: 1px solid rgba(201,163,90,.25); border-radius: 6px; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
body.playing .place { right: 220px; }
.delta.fail { border: 1px solid currentColor; border-radius: 3px; padding: 0 6px; }
@media (max-width: 640px) {
  .hud { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.playing .hud { width: auto; }
  body.playing .rel { top: 102px; left: 8px; right: 8px; width: auto; grid-template-columns: 1fr 1fr; padding: 6px 10px; }
  body.playing .place { top: 160px; right: 12px; }
  body.playing .srcpop { top: 188px; }
  body.playing .menu { padding-top: 180px; }
}

/* 불심 줄, 사료 버튼과 우호 패널이 겹치지 않게 */
.stat[hidden] { display: none; }
.s-buddha .bar { display: none; } .s-buddha b { color: #e3b3b8; letter-spacing: .12em; font-size: .9rem; }
body.playing .place { right: 236px; }
body.playing .srcpop { right: 236px; }
@media (max-width: 640px) {
  body.playing .rel { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); }
  body.playing .place, body.playing .srcpop { right: 12px; }
}

/* 수치 다섯 개 */
.hud { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.s-army i { background: #9c8f7a; } .s-gold i { background: #e0c27a; }
body.playing .hud { width: min(620px, 60vw); }
@media (max-width: 640px) {
  .hud { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.playing .hud { width: auto; }
  body.playing .rel { top: 132px; }
  body.playing .place { top: 192px; }
  body.playing .srcpop { top: 220px; }
  body.playing .menu { padding-top: 210px; }
  body.playing .sprite { bottom: 16%; }
}

/* 사료 창 닫기 버튼 */
.srcpop { padding-top: 40px; }
.srcclose { position: absolute; top: 8px; right: 10px; cursor: pointer; }

/* 사료 창: 원문 아래 한글 번역 */
.srcpop { max-height: min(60vh, 520px); overflow-y: auto; }
.srcpop .ko { font-size: .92rem; line-height: 1.8; margin: 8px 0 6px; padding-top: 8px; border-top: 1px dashed var(--line); }

/* 첫 화면: 제목만 */
body.titled { padding: 0; overflow: hidden; }
body.titled header, body.titled .hud, body.titled .rel, body.titled footer { display: none; }
.title-screen { position: fixed; inset: 0; z-index: 20; cursor: pointer; background: #07080a; }
.title-screen svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title-screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 45%, rgba(18,20,23,.92) 85%); pointer-events: none; }
.title-screen .mast { position: absolute; z-index: 1; left: 0; right: 0; bottom: 12vh; text-align: center; padding: 0 16px; }
.title-screen .han { font-family: var(--f-han); font-weight: 700; color: var(--amber); font-size: clamp(3.4rem, 14vw, 7rem); letter-spacing: .18em; line-height: 1.1; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.title-screen .ko { font-family: var(--f-display); font-weight: 800; font-size: clamp(1rem, 2.6vw, 1.4rem); letter-spacing: .3em; margin-top: 10px; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.title-screen .tap { margin-top: 5vh; font-size: .85rem; color: var(--dim); letter-spacing: .2em; animation: blink 1.6s ease-in-out infinite; }
.title-screen:focus-visible { outline: 2px solid var(--amber); outline-offset: -6px; }
@media (prefers-reduced-motion: reduce) { .title-screen .tap { animation: none; } }

/* 휴대폰: 대사창은 글 길이만큼만 */
@media (max-width: 640px) {
  body.playing .box { height: auto; min-height: 0; max-height: 40%; padding: 12px 14px 22px; bottom: 8px; }
  body.playing .line { font-size: .95rem; line-height: 1.7; }
  body.playing .name { margin: -4px 0 6px; font-size: .8rem; }
}

/* 휴대폰: 위쪽 수치를 촘촘하게 */
@media (max-width: 640px) {
  body.playing header { top: 6px; right: 8px; }
  body.playing header .ghost { padding: 2px 8px; font-size: .75rem; }
  body.playing .hud { top: 36px; padding: 5px 9px; gap: 3px 10px; }
  body.playing .rel { top: 104px; padding: 5px 9px; gap: 3px 10px; }
  body.playing .stat { gap: 2px; }
  body.playing .stat .lab { font-size: .66rem; }
  body.playing .bar { height: 4px; }
  body.playing .place { top: 144px; font-size: .78rem; }
  body.playing .place b { font-size: .98rem; }
  body.playing .srcpop { top: 172px; }
  body.playing .menu { padding-top: 168px; }
}

/* 다섯 수치: 그림 개수로 */
.hud .bar { display: none; }
.hud .stat .lab { flex-direction: column; align-items: flex-start; gap: 1px; white-space: nowrap; }
.hud .stat .lab b { font-size: .82rem; letter-spacing: .02em; white-space: nowrap; }
.hud .ic.off { opacity: .18; filter: grayscale(1); }
@media (max-width: 640px) {
  .hud, body.playing .hud { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px 6px; }
  body.playing .hud .stat .lab { font-size: .62rem; }
  body.playing .hud .stat .lab b { font-size: .62rem; letter-spacing: 0; }
  body.playing .rel { top: 90px; }
  body.playing .place { top: 130px; }
  body.playing .srcpop { top: 158px; }
  body.playing .menu { padding-top: 154px; }
}

/* 유물 그림 아이콘 */
.ics { display: inline-flex; gap: 2px; vertical-align: middle; }
.gl { width: 1.05em; height: 1.05em; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }

.g-power { color: #e2b85c; } .g-army { color: #b9c2c0; } .g-gold { color: #c9944a; }
.g-nobles { color: #8fb79f; } .g-people { color: #d9b25a; } .g-buddha { color: #e6a9b4; }
.hud .stat .lab b { font-size: .95rem; }
.s-buddha b { font-size: .95rem !important; letter-spacing: 0 !important; }
@media (max-width: 640px) { body.playing .hud .stat .lab b { font-size: .78rem; } }

/* 우호도도 그림 개수로 */
.rel .bar { display: none; }
.rel .stat .lab { align-items: center; }
.rel .stat .lab b { font-size: .95rem; }
.g-yang { color: #d98a5b; } .g-wa { color: #8fb0d6; }

/* 아이콘이 칸 너비를 넘지 않게: 칸이 좁으면 그림이 작아진다 */
.hud .stat, .rel .stat { min-width: 0; }
.hud .stat .lab, .rel .stat .lab { min-width: 0; }
.hud .stat .lab b, .rel .stat .lab b { display: block; min-width: 0; max-width: 100%; }
.hud .ics, .rel .ics { display: flex; gap: 1px; max-width: 100%; }
.hud .gl, .rel .gl { flex: 0 1 auto; min-width: 0; width: 1.05em; height: auto; aspect-ratio: 1; }
@media (max-width: 640px) {
  body.playing .hud .ics, body.playing .rel .ics { display: grid; grid-template-columns: repeat(5, minmax(0, 15px)); gap: 1px; width: 100%; }

  body.playing .rel .stat .lab { flex-direction: column; align-items: flex-start; gap: 1px; white-space: nowrap; font-size: .62rem; }

.hud .stat, .rel .stat { position: relative; }

function relics() {
  const r = [];
  if (S.stone === "beng") r.push("jiseok");
  if (S.stone) r.push("maeji");
  if (S.yang >= 60) r.push("brick");
  if (S.yang >= 60 && S.buddha >= 2) r.push("lotus");
  if (S.wa >= 60) r.push("coffin");
  if (S.liang) r.push("celadon");
  if (S.rites || S.stone) r.push("beast");
  return r;
}
function missing() {
  const r = relics();
  return Object.keys(RELIC).filter(k => !r.includes(k));
}
function tombEnding() {
  if (!S.stone) return "end_nameless";
  return relics().length === Object.keys(RELIC).length ? "end_tomb" : "end_other";
}

    const m = openMenu(n.choices.map((c, i) => {
      const need = Object.entries(c.need || {});
      const locked = need.some(([k, v]) => S[k] < v) || !!val(c.lock);
      const sub = [need.map(([k, v]) => S[k] < v ? `${josa(NAME[k])} 모자라다` : `${josa(NAME[k])} 받쳐 줘야 한다`).join(" · "), val(c.lock) ? val(c.lockText) : "", val(c.sub) || ""].filter(Boolean).join(" · ");
      const cost = typeof c.eff === "function" ? `<span class="delta fate">결과는 알 수 없다</span>`
        : ALL.filter(k => c.eff?.[k]).map(k => arrow(k, c.eff[k])).join("");
      return `<button class="choice${c.next ? " next" : ""}" data-i="${i}" type="button"${locked ? " disabled" : ""}>${esc(c.label)}${sub ? `<small>${esc(sub)}</small>` : ""}${cost ? `<span class="cost">${cost}</span>` : ""}</button>`;
    }).join(""));
    m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => pick(n.choices[+b.dataset.i]));
  });
}

/* 선택은 열에 여덟은 뜻대로 된다. 다음으로 넘기기·결말로 가는 선택·즉위와 장례는 실패하지 않는다 */
const SUCCESS = 0.8;
function risky(c) {
  if (c.next || N[cur]?.sure) return false;
  if (typeof c.go === "string" && N[c.go]?.end) return false;
  return typeof c.eff === "function" || Object.values(c.eff || {}).some(v => v > 0) || !!c.set;
}
function pick(c) {
  const d = {};
  const failed = risky(c) && Math.random() > SUCCESS;
  const res = failed ? (c.fail || [FAILS[Math.floor(Math.random() * FAILS.length)]]) : val(c.res);   // 결과 문단은 수치 변경 전 상태로 판단
  let go = val(c.go);
  const eff = failed ? Object.fromEntries(Object.entries(typeof c.eff === "object" ? c.eff : {}).filter(([, v]) => v < 0)) : (val(c.eff) || {});
  for (const k in eff) { const before = S[k]; S[k] = clamp(S[k] + eff[k]); d[k] = S[k] - before; }
  if (!failed) for (const k in c.set || {}) S[k] = val(c.set[k]);
  if (!N[go]?.end && go !== "funeral" && go !== "epilogue") {
    if (S.people <= 0) go = "end_revolt";
    else if (S.nobles <= 0 || S.power <= 0) go = "end_coup";
    else go = maybeEvent(go);
  }
  if (!res) return render(go, d);
  cur = go;
  paintHud(d);
  play(toLines(res), () => render(go), change(d, failed));
}
function maybeEvent(go) {
  if (N[cur]?.ev || !EV_SLOTS.includes(go) || S.evs >= EV_MAX || Math.random() > 0.5) return go;
  const left = Object.keys(EV).filter(k => !S.seen.includes(k));
  if (!left.length) return go;
  const k = left[Math.floor(Math.random() * left.length)];
  S.evs++; S.seen.push(k); pending = go;
  return k;
}

function page(html) {
  document.body.classList.remove("playing", "titled");
  $("stage").innerHTML = html;
  window.scrollTo({ top: 0 });
}
function book() {
  const got = new Set(load("sama-ends")), rel = new Set(load("sama-relics"));
  page(`<article class="scene"><div class="art">${svgBg("tomb")}</div><div class="inner"><h2>도감</h2>
    <p class="note">엔딩 ${got.size} / ${ENDS.length} · 부장품 ${rel.size} / ${Object.keys(RELIC).length} · 이 브라우저에만 기록됩니다.</p>
    <h3>엔딩</h3>
    <div class="book">${ENDS.map(k => got.has(k)
      ? `<div class="got"><b>${esc(N[k].title)}</b><br><span class="note">${esc(N[k].tag)}</span></div>`
      : `<div class="no">？？？<br><span class="note">${esc(N[k].tag)}</span></div>`).join("")}</div>
    <h3>부장품</h3>
    <div class="book">${Object.keys(RELIC).map(k => rel.has(k)
      ? `<div class="got"><b>${esc(RELIC[k].name)}</b><br><span class="note">${esc(RELIC[k].found)}</span></div>`
      : `<div class="no">？？？</div>`).join("")}</div>
  </div></article>
  <div class="choices" style="margin-top:12px"><button class="choice next" id="back" type="button">돌아가기</button></div>`);
  $("back").onclick = () => N[cur] ? render(cur) : cover();
}
function cover() {
  reset(); cur = "cover";
  paintHud();
  page(`<div class="title-screen" id="title" role="button" tabindex="0" aria-label="게임 시작">
    ${svgBg("tomb")}
    <div class="mast"><div class="han" lang="zh-Hant">斯麻</div><div class="ko">사마 · 무령왕, 이름을 남긴 왕</div><div class="tap">화면을 누르면 시작합니다</div></div>
  </div>`);
  document.body.classList.add("titled");
  const go = () => { document.body.classList.remove("titled"); render("mono"); };
  $("title").onclick = go;
  $("title").onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } };
}
function restart() { cover(); }
$("btn-restart").onclick = restart;
$("btn-book").onclick = book;

function start(data) {
  if (data && data.S && data.cur && N[data.cur] && "yang" in data.S) {
    reset();
    S = Object.assign(S, data.S);            // 이전 판에 없던 수치(군사력·재정 등)는 기본값으로 채운다
    for (const k of ALL) if (typeof S[k] !== "number") S[k] = START[k];
    pending = data.pending || null; render(data.cur);
  }
  else restart();
}
window.claude?.hot?.snapshot?.(() => ({ S, cur, pending }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
